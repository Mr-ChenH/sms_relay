services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: sms-relay:local
    restart: unless-stopped
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      SMS_HUB_PUBLIC_BASE_URL: "${SMS_HUB_PUBLIC_BASE_URL:-}"
      SMS_HUB_PUBLIC_MQTT_BROKER: "${SMS_HUB_PUBLIC_MQTT_BROKER:-}"
    ports:
      - "${SMS_HUB_HTTP_PORT:-8080}:8080"
      - "1883:1883"
    volumes:
      - ./data:/data
